<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="act3page2.css" rel="stylesheet">
  </head>
  <body>

    <div class="login-card">
      <h1 class="login-title">Register</h1>
      
      <form id="registerForm" novalidate>
        <div class="mb-3 input-wrapper">
          <input type="text" id="username" class="form-control" placeholder="Username" required>
          <i class="bi bi-person icon"></i>
          <div class="fb-error" id="usernameError">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span></span>
          </div>
        </div>

        <div class="mb-3 input-wrapper">
          <input type="email" id="email" class="form-control" placeholder="Email Address" required>
          <i class="bi bi-envelope icon"></i>
          <div class="fb-error" id="emailError">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span></span>
          </div>
        </div>

        <div class="mb-3 input-wrapper">
          <input type="tel" id="phone" class="form-control" placeholder="Phone Number" required>
          <i class="bi bi-telephone icon"></i>
          <div class="fb-error" id="phoneError">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span></span>
          </div>
        </div>

        <div class="mb-3 input-wrapper">
          <input type="password" id="password" class="form-control" placeholder="Password" required>
          <i class="bi bi-lock icon"></i>
          <div class="fb-error" id="passwordError">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span></span>
          </div>
        </div>

        <div class="mb-3 input-wrapper">
          <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm Password" required>
          <i class="bi bi-shield-lock icon"></i>
          <div class="fb-error" id="confirmPasswordError">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span></span>
          </div>
        </div>

        <button type="submit" class="btn btn-login w-100">Register</button>

        <div class="text-center mt-3 register-text">
          <span>Already have an account? </span>
          <a href="index.html" class="register-link">Login Here</a>
        </div>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const form = document.getElementById('registerForm');

      const fields = {
        username: document.getElementById('username'),
        email: document.getElementById('email'),
        phone: document.getElementById('phone'),
        password: document.getElementById('password'),
        confirmPassword: document.getElementById('confirmPassword'),
      };

      const errors = {
        username: document.getElementById('usernameError'),
        email: document.getElementById('emailError'),
        phone: document.getElementById('phoneError'),
        password: document.getElementById('passwordError'),
        confirmPassword: document.getElementById('confirmPasswordError'),
      };

      const hideErrorTimers = {};

      function showError(key, message) {
        fields[key].classList.add('is-invalid-fb');
        errors[key].querySelector('span').textContent = message;
        errors[key].classList.add('show');
        clearTimeout(hideErrorTimers[key]);
        hideErrorTimers[key] = setTimeout(() => {
          clearError(key);
        }, 900);
      }

      function clearError(key) {
        clearTimeout(hideErrorTimers[key]);
        fields[key].classList.remove('is-invalid-fb');
        errors[key].classList.remove('show');
        errors[key].querySelector('span').textContent = '';
      }

      function validateUsername() {
        const value = fields.username.value.trim();
        if (value.length === 0) {
          showError('username', 'Please enter a username.');
          return false;
        }
        if (value.length < 3) {
          showError('username', 'Your username must be at least 3 characters.');
          return false;
        }
        clearError('username');
        return true;
      }

      function validateEmail() {
        const value = fields.email.value.trim();
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (value.length === 0) {
          showError('email', 'Please enter a valid mobile number or email address.');
          return false;
        }
        if (!emailRegex.test(value)) {
          showError('email', 'Please enter a valid mobile number or email address.');
          return false;
        }
        clearError('email');
        return true;
      }

      function validatePhone() {
        const value = fields.phone.value.trim();
        const phoneRegex = /^[0-9+\-()\s]{7,20}$/;
        if (value.length === 0) {
          showError('phone', 'Please enter a valid phone number.');
          return false;
        }
        if (!phoneRegex.test(value)) {
          showError('phone', 'Please enter a valid phone number.');
          return false;
        }
        clearError('phone');
        return true;
      }

      function validatePassword() {
        const value = fields.password.value;
        if (value.length === 0) {
          showError('password', 'Please choose a more secure password. It should be longer than 6 characters, unique to you, and difficult for others to guess.');
          return false;
        }
        if (value.length <= 6) {
          showError('password', 'Please choose a more secure password. It should be longer than 6 characters, unique to you, and difficult for others to guess.');
          return false;
        }
        const usernameVal = fields.username.value.trim().toLowerCase();
        if (usernameVal && value.toLowerCase().includes(usernameVal)) {
          showError('password', 'Please choose a more secure password. It should be longer than 6 characters, unique to you, and difficult for others to guess.');
          return false;
        }
        clearError('password');
        return true;
      }

      function validateConfirmPassword() {
        const value = fields.confirmPassword.value;
        if (value.length === 0) {
          showError('confirmPassword', 'Please re-enter your password.');
          return false;
        }
        if (value !== fields.password.value) {
          showError('confirmPassword', 'The two passwords that you entered do not match.');
          return false;
        }
        clearError('confirmPassword');
        return true;
      }

      function bindLiveValidation(input, handler) {
        ['input', 'keyup', 'change', 'blur'].forEach(evt => {
          input.addEventListener(evt, handler);
        });
      }

      bindLiveValidation(fields.username, () => {
        validateUsername();
        if (fields.password.value.length > 0) validatePassword();
      });
      bindLiveValidation(fields.email, validateEmail);
      bindLiveValidation(fields.phone, validatePhone);
      bindLiveValidation(fields.password, () => {
        validatePassword();
        if (fields.confirmPassword.value.length > 0) validateConfirmPassword();
      });
      bindLiveValidation(fields.confirmPassword, validateConfirmPassword);

      form.addEventListener('submit', function (e) {
        e.preventDefault();

        const validUsername = validateUsername();
        const validEmail = validateEmail();
        const validPhone = validatePhone();
        const validPassword = validatePassword();
        const validConfirm = validateConfirmPassword();

        if (validUsername && validEmail && validPhone && validPassword && validConfirm) {
          window.location.href = 'index.html';
        }
      });
    </script>
  </body>
</html>
