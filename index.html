<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pixel World</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="act3.css" rel="stylesheet">
  </head>
  <body>

    <div class="login-card">
      <h1 class="login-title">Login</h1>
      
      <form id="loginForm" novalidate>
        <div class="mb-3 input-wrapper">
          <input type="text" id="loginUsername" class="form-control" placeholder="Username or Email" required>
          <i class="bi bi-person icon"></i>
          <div class="fb-error" id="loginUsernameError">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span></span>
          </div>
        </div>

        <div class="mb-3 input-wrapper">
          <input type="password" id="loginPassword" class="form-control" placeholder="Password" required>
          <i class="bi bi-lock icon"></i>
          <div class="fb-error" id="loginPasswordError">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span></span>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3 options-row">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="rememberMe">
            <label class="form-check-label" for="rememberMe">Remember me</label>
          </div>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-login w-100">Login</button>

        <div class="text-center mt-3 register-text">
          <span>Don't have an account? </span>
          <a href="Act3page2.html" class="register-link">Register</a>
        </div>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const loginForm = document.getElementById('loginForm');

      const fields = {
        username: document.getElementById('loginUsername'),
        password: document.getElementById('loginPassword')
      };

      const errors = {
        username: document.getElementById('loginUsernameError'),
        password: document.getElementById('loginPasswordError')
      };

      const hideErrorTimers = {};

      function showLoginError(key, message) {
        fields[key].classList.add('is-invalid-fb');
        errors[key].querySelector('span').textContent = message;
        errors[key].classList.add('show');
        clearTimeout(hideErrorTimers[key]);
        hideErrorTimers[key] = setTimeout(() => {
          clearLoginError(key);
        }, 900);
      }

      function clearLoginError(key) {
        clearTimeout(hideErrorTimers[key]);
        fields[key].classList.remove('is-invalid-fb');
        errors[key].classList.remove('show');
        errors[key].querySelector('span').textContent = '';
      }

      function validateLoginUsername() {
        const value = fields.username.value.trim();
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (value.length === 0) {
          showLoginError('username', 'Please enter your username or email.');
          return false;
        }

        if (!emailRegex.test(value) && value.length < 3) {
          showLoginError('username', 'Please enter a valid username or email address.');
          return false;
        }

        clearLoginError('username');
        return true;
      }

      function validateLoginPassword() {
        const value = fields.password.value;

        if (value.length === 0) {
          showLoginError('password', 'Please enter your password.');
          return false;
        }

        if (value.length < 6) {
          showLoginError('password', 'Your password must be at least 6 characters.');
          return false;
        }

        clearLoginError('password');
        return true;
      }

      function bindLiveValidation(input, handler) {
        ['input', 'keyup', 'change', 'blur'].forEach(evt => {
          input.addEventListener(evt, handler);
        });
      }

      bindLiveValidation(fields.username, () => {
        if (fields.username.value.trim().length > 0) {
          validateLoginUsername();
        }
      });

      bindLiveValidation(fields.password, () => {
        if (fields.password.value.length > 0) {
          validateLoginPassword();
        }
      });

      loginForm.addEventListener('submit', function (e) {
        e.preventDefault();

        const validUsername = validateLoginUsername();
        const validPassword = validateLoginPassword();

        if (validUsername && validPassword) {
          window.location.href = 'landing-page.html';
        }
      });
    </script>
  </body>
</html>
